# Render blueprint: persistent Node web-service for BrimLearn.
#
# Deploys the full app (Express + tRPC + Google OAuth + Firestore) and serves
# the built client from dist/public. `sync: false` values must be pasted in
# the Render dashboard under Environment (they won't be read from the git repo).
#
# After the deploy, add this exact URL to the Google Cloud "Authorized redirect
# URIs" for your OAuth client:
#   https://<your-service>.onrender.com/api/oauth/google/callback

services:
  - type: web
    name: brimlearn
    runtime: node
    plan: free
    buildCommand: npm cache clean --force && npm ci --prefer-online && node -e "console.log('PLUGIN_INSTALLED', require.resolve('@tailwindcss/vite'))" && npm run build
    startCommand: npm start
    healthCheckPath: /api/oauth/google/config
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false